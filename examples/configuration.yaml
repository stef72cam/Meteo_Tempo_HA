# Remplacer uniquement la définition existante du capteur command_line TEMPO.
# Si command_line existe déjà, fusionner les entrées, ne pas recréer la clé.
command_line:
  - sensor:
      name: tempo_prevision_simple
      command: >
        python3 /config/tempo_prevision_simple.py
        {{ states('sensor.rte_tempo_cycle_jours_restants_rouge') }}
        {{ states('sensor.rte_tempo_cycle_jours_restants_blanc') }}
        {{ states('sensor.rte_tempo_cycle_jours_restants_bleu') }}
        {{ states('sensor.rte_tempo_prochaine_couleur') }}
      command_timeout: 90
      scan_interval: 7200
      json_attributes:
        - J+1
        - J+2
        - J+3
        - J+4
        - J+5
        - J+6
        - generated_at
        - version
        - diagnostics
        - error
      value_template: "{{ 'error' if value_json.get('error') else 'ok' }}"

# Remplacer les anciens capteurs Tempo correspondants, sans dupliquer template:.
template:
  - sensor:
      - name: tempo_j1_p_bleu
        unique_id: tempo_j1_p_bleu
        unit_of_measurement: "%"
        availability: >
          {% set j = state_attr('sensor.tempo_prevision_simple','J+1') %}
          {{ j is mapping and j.get('p_bleu') is not none }}
        state: >
          {% set j = state_attr('sensor.tempo_prevision_simple','J+1') %}
          {{ (j.get('p_bleu') * 100) | round(1) if j is mapping and j.get('p_bleu') is not none else none }}
